# The site itself has no build step: Netlify publishes the files as they are.
# This only tells Netlify where the serverless functions live
# (role-request-notify emails the administrator about role requests).
[functions]
  directory = "netlify/functions"

# The Firebase web API key in config.js and the function is public by design
# (it identifies the project; access is controlled by Firebase Auth and the
# Firestore rules), so Netlify's secret scan must not fail the deploy on it.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBdu73Xb8xf4tJU4RLhJ82ANhLMI9eu0gI"

# Two low-risk security headers for every file: browsers must not guess a
# file's type, and links to other sites only ever pass on the site's address,
# never the page address (a share link's address identifies the project).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Only QIP Assist itself and emevidence.org (whose tool viewer shows the
    # app in a frame) may embed it. Any other site trying to frame it is blocked.
    Content-Security-Policy = "frame-ancestors 'self' https://emevidence.org https://www.emevidence.org"

# Development files that the app never loads are not served to the public.
# They hold no secrets (the database rules are enforced by Firebase, not by
# keeping them private); this is tidiness.
[[redirects]]
  from = "/firestore.rules"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/firestore.indexes.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/android/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
